    <text x="710" y="22" text-anchor="middle" font-size="14.5" font-weight="800" fill="#0f172a">Weeks</text>

    <!-- Week Numbers (Columns 1 to 16, width: 53.75px each) -->
    <!-- col i center: 280 + (i - 0.5) * 53.75 -->
    <text x="306.8" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">1</text>
    <text x="360.6" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">2</text>
    <text x="414.3" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">3</text>
    <text x="468.1" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">4</text>
    <text x="521.8" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">5</text>
    <text x="575.6" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">6</text>
    <text x="629.3" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">7</text>
    <text x="683.1" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">8</text>
    <text x="736.8" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">9</text>
    <text x="790.6" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">10</text>
    <text x="844.3" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">11</text>
    <text x="898.1" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">12</text>
