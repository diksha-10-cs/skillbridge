    <line x1="387.50" y1="32" x2="387.50" y2="578" stroke="#bae6fd" stroke-width="1.2"/>
    <line x1="441.25" y1="32" x2="441.25" y2="578" stroke="#bae6fd" stroke-width="1.2"/>
    <line x1="495.00" y1="32" x2="495.00" y2="578" stroke="#bae6fd" stroke-width="1.2"/>
    <line x1="548.75" y1="32" x2="548.75" y2="578" stroke="#bae6fd" stroke-width="1.2"/>
    <line x1="602.50" y1="32" x2="602.50" y2="578" stroke="#bae6fd" stroke-width="1.2"/>
    <line x1="656.25" y1="32" x2="656.25" y2="578" stroke="#bae6fd" stroke-width="1.2"/>
    <line x1="710.00" y1="32" x2="710.00" y2="578" stroke="#bae6fd" stroke-width="1.2"/>
    <line x1="763.75" y1="32" x2="763.75" y2="578" stroke="#bae6fd" stroke-width="1.2"/>
    <line x1="817.50" y1="32" x2="817.50" y2="578" stroke="#bae6fd" stroke-width="1.2"/>
    <line x1="871.25" y1="32" x2="871.25" y2="578" stroke="#bae6fd" stroke-width="1.2"/>
    <line x1="925.00" y1="32" x2="925.00" y2="578" stroke="#bae6fd" stroke-width="1.2"/>
    <line x1="978.75" y1="32" x2="978.75" y2="578" stroke="#bae6fd" stroke-width="1.2"/>
    <line x1="1032.50" y1="32" x2="1032.50" y2="578" stroke="#bae6fd" stroke-width="1.2"/>
    <line x1="1086.25" y1="32" x2="1086.25" y2="578" stroke="#bae6fd" stroke-width="1.2"/>

