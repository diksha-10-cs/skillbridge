<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif;">
  <defs>
    <!-- Crisp drop shadow for table elevation -->
    <filter id="shadow-gantt" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f2c4c" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Title Header -->
  <text x="600" y="44" text-anchor="middle" font-size="24" font-weight="800" fill="#0c4a6e" letter-spacing="0.5">SkillBridge – Student Internship &amp; Career Management Portal</text>
  <text x="600" y="74" text-anchor="middle" font-size="18" font-weight="700" fill="#0284c7">Gantt Chart (16 Weeks Project Schedule)</text>

  <!-- Table Container (x: 30, y: 105, w: 1140, h: 578) -->
  <g transform="translate(30, 105)" filter="url(#shadow-gantt)">
    <!-- Base background -->
    <rect x="0" y="0" width="1140" height="578" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>

    <!-- Header Background: Light Sky Blue -->
    <rect x="0" y="0" width="1140" height="64" fill="#e0f2fe"/>
    
    <!-- Dividing line between Tasks column and Weeks grid -->
    <line x1="280" y1="0" x2="280" y2="578" stroke="#0284c7" stroke-width="2"/>

    <!-- Header Divider between 'Weeks' and week numbers -->
    <line x1="280" y1="32" x2="1140" y2="32" stroke="#7dd3fc" stroke-width="1.5"/>
    <!-- Bottom Header line -->
    <line x1="0" y1="64" x2="1140" y2="64" stroke="#0284c7" stroke-width="2"/>

