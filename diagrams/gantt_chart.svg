    <text x="14" y="120" font-size="12.5" font-weight="600" fill="#0f172a">2.  Requirement Gathering</text>
    <text x="14" y="154" font-size="12.5" font-weight="600" fill="#0f172a">3.  System Analysis</text>
    <text x="14" y="188" font-size="12.5" font-weight="600" fill="#0f172a">4.  UI/UX Design</text>
    <text x="14" y="222" font-size="12.5" font-weight="600" fill="#0f172a">5.  Database Design</text>
    <text x="14" y="257" font-size="12.5" font-weight="600" fill="#0f172a">6.  Frontend Development</text>
    <text x="14" y="291" font-size="12.5" font-weight="600" fill="#0f172a">7.  Backend Development</text>
    <text x="14" y="325" font-size="12.5" font-weight="600" fill="#0f172a">8.  Internship Management Module</text>
    <text x="14" y="359" font-size="12.5" font-weight="600" fill="#0f172a">9.  Application Tracking Module</text>
    <text x="14" y="394" font-size="12.5" font-weight="600" fill="#0f172a">10. Interview Prep &amp; Notes Module</text>
    <text x="14" y="428" font-size="12.5" font-weight="600" fill="#0f172a">11. Dashboard &amp; Analytics Module</text>
    <text x="14" y="462" font-size="12.5" font-weight="600" fill="#0f172a">12. Integration</text>
    <text x="14" y="496" font-size="12.5" font-weight="600" fill="#0f172a">13. Testing and Debugging</text>
    <text x="14" y="530" font-size="12.5" font-weight="600" fill="#0f172a">14. Documentation</text>
    <text x="14" y="565" font-size="12.5" font-weight="600" fill="#0f172a">15. Final Presentation</text>

    <!-- ======================================================== -->
    <!-- GANTT SCHEDULE BARS (Height: 20px, rounded rx: 3)        -->
    <!-- Matching reference image staged blue gradient hues       -->
    <!-- ======================================================== -->

    <!-- Task 1: Week 1 (x: 284 to 330) -->
    <rect x="284" y="71" width="46" height="20" rx="3" fill="#1d4ed8"/>

    <!-- Task 2: Weeks 1 to 2 (x: 284 to 384) -->
    <rect x="284" y="105" width="100" height="20" rx="3" fill="#2563eb"/>

    <!-- Task 3: Weeks 2 to 3 (x: 338 to 438) -->
    <rect x="338" y="139" width="100" height="20" rx="3" fill="#2563eb"/>

    <!-- Task 4: Weeks 3 to 4 (x: 391.5 to 491.5) -->
    <rect x="391.5" y="174" width="100" height="20" rx="3" fill="#38bdf8"/>

    <!-- Task 5: Weeks 4 to 5 (x: 445 to 545) -->
    <rect x="445" y="208" width="100" height="20" rx="3" fill="#2563eb"/>

    <!-- Task 6: Weeks 4 to 7 (x: 445 to 652) -->
    <rect x="445" y="242" width="207" height="20" rx="3" fill="#60a5fa"/>

    <!-- Task 7: Weeks 5 to 8 (x: 499 to 706) -->
    <rect x="499" y="276" width="207" height="20" rx="3" fill="#1d4ed8"/>

    <!-- Task 8: Weeks 6 to 8 (x: 552.5 to 706) -->
    <rect x="552.5" y="311" width="153.5" height="20" rx="3" fill="#38bdf8"/>

    <!-- Task 9: Weeks 7 to 9 (x: 606 to 760) -->
    <rect x="606" y="345" width="154" height="20" rx="3" fill="#2563eb"/>

    <!-- Task 10: Weeks 8 to 10 (x: 660 to 814) -->
    <rect x="660" y="379" width="154" height="20" rx="3" fill="#38bdf8"/>

    <!-- Task 11: Weeks 9 to 11 (x: 714 to 867) -->
    <rect x="714" y="413" width="153" height="20" rx="3" fill="#2563eb"/>

    <!-- Task 12: Weeks 11 to 13 (x: 821 to 975) -->
    <rect x="821" y="448" width="154" height="20" rx="3" fill="#60a5fa"/>

    <!-- Task 13: Weeks 12 to 14 (x: 875 to 1029) -->
    <rect x="875" y="482" width="154" height="20" rx="3" fill="#2563eb"/>

    <!-- Task 14: Weeks 13 to 16 (x: 929 to 1136) -->
    <rect x="929" y="516" width="207" height="20" rx="3" fill="#38bdf8"/>

    <!-- Task 15: Week 16 (x: 1090 to 1136) -->
    <rect x="1090" y="550" width="46" height="20" rx="3" fill="#1d4ed8"/>
