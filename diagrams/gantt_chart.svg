    <text x="1005.6" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">14</text>
    <text x="1059.3" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">15</text>
    <text x="1113.1" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">16</text>

