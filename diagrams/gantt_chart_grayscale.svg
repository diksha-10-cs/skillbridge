    <line x1="0" y1="372.40" x2="1140" y2="372.40" stroke="#e5e7eb" stroke-width="1"/>
    <line x1="0" y1="406.66" x2="1140" y2="406.66" stroke="#e5e7eb" stroke-width="1"/>
