  <text x="600" y="74" text-anchor="middle" font-size="17.5" font-weight="700" fill="#374151">Gantt Chart (16 Weeks Project Schedule) – Academic Grayscale</text>

  <!-- Table Container (x: 30, y: 105, w: 1140, h: 578) -->
  <g transform="translate(30, 105)" filter="url(#shadow-gantt-gs)">
    <!-- Base background -->
    <rect x="0" y="0" width="1140" height="578" fill="#ffffff" stroke="#111827" stroke-width="2"/>

    <!-- Header Background: Light Neutral Gray -->
    <rect x="0" y="0" width="1140" height="64" fill="#f3f4f6"/>
    
    <!-- Dividing line between Tasks column and Weeks grid -->
    <line x1="280" y1="0" x2="280" y2="578" stroke="#111827" stroke-width="2"/>

    <!-- Header Divider between 'Weeks' and week numbers -->
