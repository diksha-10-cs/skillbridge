    <line x1="0" y1="64" x2="1140" y2="64" stroke="#111827" stroke-width="2"/>

    <!-- Header Texts -->
    <text x="140" y="38" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">Tasks</text>
    <text x="710" y="22" text-anchor="middle" font-size="14.5" font-weight="800" fill="#111827">Weeks</text>

    <!-- Week Numbers (Columns 1 to 16, width: 53.75px each) -->
