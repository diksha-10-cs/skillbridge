    <text x="14" y="86" font-size="12.5" font-weight="600" fill="#111827">1.  Project Topic Selection</text>
    <text x="14" y="120" font-size="12.5" font-weight="600" fill="#111827">2.  Requirement Gathering</text>
    <text x="14" y="154" font-size="12.5" font-weight="600" fill="#111827">3.  System Analysis</text>
    <text x="14" y="188" font-size="12.5" font-weight="600" fill="#111827">4.  UI/UX Design</text>
    <text x="14" y="222" font-size="12.5" font-weight="600" fill="#111827">5.  Database Design</text>
    <text x="14" y="257" font-size="12.5" font-weight="600" fill="#111827">6.  Frontend Development</text>
    <text x="14" y="291" font-size="12.5" font-weight="600" fill="#111827">7.  Backend Development</text>
    <text x="14" y="325" font-size="12.5" font-weight="600" fill="#111827">8.  Internship Management Module</text>
    <text x="14" y="359" font-size="12.5" font-weight="600" fill="#111827">9.  Application Tracking Module</text>
    <text x="14" y="394" font-size="12.5" font-weight="600" fill="#111827">10. Interview Prep &amp; Notes Module</text>
    <text x="14" y="428" font-size="12.5" font-weight="600" fill="#111827">11. Dashboard &amp; Analytics Module</text>
    <text x="14" y="462" font-size="12.5" font-weight="600" fill="#111827">12. Integration</text>
    <text x="14" y="496" font-size="12.5" font-weight="600" fill="#111827">13. Testing and Debugging</text>
    <text x="14" y="530" font-size="12.5" font-weight="600" fill="#111827">14. Documentation</text>
    <text x="14" y="565" font-size="12.5" font-weight="600" fill="#111827">15. Final Presentation</text>

    <!-- ======================================================== -->
    <!-- GANTT SCHEDULE BARS (Academic Grayscale Shading)          -->
    <!-- ======================================================== -->

    <!-- Task 1: Week 1 -->
    <rect x="284" y="71" width="46" height="20" rx="3" fill="#1f2937"/>

    <!-- Task 2: Weeks 1 to 2 -->
    <rect x="284" y="105" width="100" height="20" rx="3" fill="#374151"/>

    <!-- Task 3: Weeks 2 to 3 -->
    <rect x="338" y="139" width="100" height="20" rx="3" fill="#374151"/>

