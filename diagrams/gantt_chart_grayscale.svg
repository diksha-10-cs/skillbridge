    <text x="360.6" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">2</text>
    <text x="414.3" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">3</text>
    <text x="468.1" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">4</text>
    <text x="521.8" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">5</text>
