<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 740" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif;">
  <defs>
    <!-- Open Arrow for UML Include/Extend -->
    <marker id="arrow-uml" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#111827"/>
    </marker>
    <filter id="shadow-gsuc" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Title Header -->
  <text x="575" y="40" text-anchor="middle" font-size="24" font-weight="800" fill="#111827" letter-spacing="0.5">SkillBridge System UML Use Case Diagram</text>
  <text x="575" y="66" text-anchor="middle" font-size="16.5" font-weight="700" fill="#374151">Actors, Interactions &amp; Functional Scope (Grayscale)</text>

  <!-- System Boundary Box -->
  <rect x="180" y="85" width="790" height="635" rx="8" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <rect x="180" y="85" width="790" height="32" rx="8" fill="#f3f4f6" stroke="#111827" stroke-width="1.2"/>
  <text x="575" y="107" text-anchor="middle" font-size="14" font-weight="800" fill="#111827" letter-spacing="1">SKILLBRIDGE APPLICATION SYSTEM BOUNDARY</text>

  <!-- ======================================================== -->
  <!-- ACTOR 1: Student (Left Side)                             -->
  <!-- ======================================================== -->
  <g transform="translate(55, 310)">
    <!-- Head -->
    <circle cx="35" cy="20" r="16" fill="#ffffff" stroke="#111827" stroke-width="2.5"/>
    <!-- Body -->
    <line x1="35" y1="36" x2="35" y2="85" stroke="#111827" stroke-width="2.5"/>
    <!-- Arms -->
    <line x1="5" y1="52" x2="65" y2="52" stroke="#111827" stroke-width="2.5"/>
    <!-- Left Leg -->
    <line x1="35" y1="85" x2="10" y2="135" stroke="#111827" stroke-width="2.5"/>
    <!-- Right Leg -->
    <line x1="35" y1="85" x2="60" y2="135" stroke="#111827" stroke-width="2.5"/>
    <!-- Label -->
    <text x="35" y="160" text-anchor="middle" font-size="17" font-weight="800" fill="#111827">Student</text>
    <text x="35" y="178" text-anchor="middle" font-size="11.5" font-weight="600" fill="#4b5563">(Primary Actor)</text>
  </g>

  <!-- ======================================================== -->
  <!-- ACTOR 2: Admin / TPO (Right Side)                        -->
  <!-- ======================================================== -->
  <g transform="translate(1015, 310)">
    <!-- Head -->
    <circle cx="35" cy="20" r="16" fill="#ffffff" stroke="#111827" stroke-width="2.5"/>
    <!-- Body -->
    <line x1="35" y1="36" x2="35" y2="85" stroke="#111827" stroke-width="2.5"/>
    <!-- Arms -->
    <line x1="5" y1="52" x2="65" y2="52" stroke="#111827" stroke-width="2.5"/>
    <!-- Left Leg -->
    <line x1="35" y1="85" x2="10" y2="135" stroke="#111827" stroke-width="2.5"/>
    <!-- Right Leg -->
    <line x1="35" y1="85" x2="60" y2="135" stroke="#111827" stroke-width="2.5"/>
    <!-- Label -->
    <text x="35" y="160" text-anchor="middle" font-size="16" font-weight="800" fill="#111827">Admin / TPO</text>
    <text x="35" y="178" text-anchor="middle" font-size="11.5" font-weight="600" fill="#4b5563">(Secondary Actor)</text>
  </g>

  <!-- ======================================================== -->
  <!-- STUDENT ASSOCIATION BUS: Clean orthogonal tree routing   -->
  <!-- ======================================================== -->
  <!-- Horizontal arm from Student torso to vertical bus -->
  <line x1="90" y1="362" x2="140" y2="362" stroke="#111827" stroke-width="2"/>
  <!-- Vertical Bus spanning all 7 Student Use Cases -->
  <line x1="140" y1="150" x2="140" y2="654" stroke="#111827" stroke-width="1.8"/>

  <!-- Horizontal branch to UC1 -->
  <line x1="140" y1="150" x2="200" y2="150" stroke="#111827" stroke-width="1.8"/>
  <!-- Horizontal branch to UC2 -->
  <line x1="140" y1="234" x2="200" y2="234" stroke="#111827" stroke-width="1.8"/>
  <!-- Horizontal branch to UC3 -->
  <line x1="140" y1="318" x2="200" y2="318" stroke="#111827" stroke-width="1.8"/>
  <!-- Horizontal branch to UC4 -->
  <line x1="140" y1="402" x2="200" y2="402" stroke="#111827" stroke-width="1.8"/>
  <!-- Horizontal branch to UC5 -->
  <line x1="140" y1="486" x2="200" y2="486" stroke="#111827" stroke-width="1.8"/>
  <!-- Horizontal branch to UC6 -->
  <line x1="140" y1="570" x2="200" y2="570" stroke="#111827" stroke-width="1.8"/>
  <!-- Horizontal branch to UC7 -->
  <line x1="140" y1="654" x2="200" y2="654" stroke="#111827" stroke-width="1.8"/>

  <!-- ======================================================== -->
  <!-- PRIMARY STUDENT USE CASES (Column 1)                     -->
  <!-- ======================================================== -->

  <!-- UC1: Register & Login -->
  <g transform="translate(200, 126)">
    <ellipse cx="85" cy="24" rx="85" ry="24" fill="#ffffff" stroke="#111827" stroke-width="1.8"/>
    <text x="85" y="29" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111827">Register / Login</text>
  </g>

  <!-- UC1 Included: Manage Profile -->
  <g transform="translate(440, 126)">
    <ellipse cx="90" cy="24" rx="90" ry="24" fill="#f9fafb" stroke="#111827" stroke-width="1.8"/>
    <text x="90" y="29" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111827">Manage Profile</text>
  </g>
  <line x1="370" y1="150" x2="438" y2="150" stroke="#374151" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-uml)"/>
  <rect x="375" y="138" width="56" height="13" fill="#ffffff"/>
  <text x="403" y="147" text-anchor="middle" font-size="10.5" font-style="italic" font-weight="700" fill="#111827">&lt;&lt;include&gt;&gt;</text>

  <!-- UC2: Track Applications -->
  <g transform="translate(200, 210)">
    <ellipse cx="85" cy="24" rx="85" ry="24" fill="#ffffff" stroke="#111827" stroke-width="1.8"/>
    <text x="85" y="29" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111827">Track Applications</text>
  </g>

  <!-- UC2 Included: Add / Edit Applications -->
  <g transform="translate(440, 210)">
    <ellipse cx="90" cy="24" rx="90" ry="24" fill="#f9fafb" stroke="#111827" stroke-width="1.8"/>
    <text x="90" y="29" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111827">Add / Edit Postings</text>
  </g>
  <line x1="370" y1="234" x2="438" y2="234" stroke="#374151" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-uml)"/>
  <rect x="375" y="222" width="56" height="13" fill="#ffffff"/>
  <text x="403" y="231" text-anchor="middle" font-size="10.5" font-style="italic" font-weight="700" fill="#111827">&lt;&lt;include&gt;&gt;</text>

  <!-- UC3: Update Status -->
  <g transform="translate(200, 294)">
    <ellipse cx="85" cy="24" rx="85" ry="24" fill="#ffffff" stroke="#111827" stroke-width="1.8"/>
    <text x="85" y="29" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111827">Update Status</text>
  </g>

  <!-- UC3 Extended: Mark as Selected -->
  <g transform="translate(440, 294)">
    <ellipse cx="90" cy="24" rx="90" ry="24" fill="#f9fafb" stroke="#111827" stroke-width="1.8"/>
    <text x="90" y="29" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111827">Mark as Selected</text>
  </g>
  <line x1="440" y1="318" x2="372" y2="318" stroke="#374151" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-uml)"/>
  <rect x="377" y="306" width="54" height="13" fill="#ffffff"/>
  <text x="404" y="315" text-anchor="middle" font-size="10.5" font-style="italic" font-weight="700" fill="#111827">&lt;&lt;extend&gt;&gt;</text>

  <!-- UC4: View Dashboard & Stats -->
  <g transform="translate(200, 378)">
    <ellipse cx="85" cy="24" rx="85" ry="24" fill="#ffffff" stroke="#111827" stroke-width="1.8"/>
    <text x="85" y="29" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111827">View Live Dashboard</text>
  </g>

  <!-- UC4 Included: Real-time KPI Stats -->
  <g transform="translate(440, 378)">
    <ellipse cx="90" cy="24" rx="90" ry="24" fill="#f9fafb" stroke="#111827" stroke-width="1.8"/>
    <text x="90" y="29" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111827">Real-time KPI Stats</text>
  </g>
  <line x1="370" y1="402" x2="438" y2="402" stroke="#374151" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-uml)"/>
  <rect x="375" y="390" width="56" height="13" fill="#ffffff"/>
  <text x="403" y="399" text-anchor="middle" font-size="10.5" font-style="italic" font-weight="700" fill="#111827">&lt;&lt;include&gt;&gt;</text>

  <!-- UC5: Search & Filter -->
  <g transform="translate(200, 462)">
    <ellipse cx="85" cy="24" rx="85" ry="24" fill="#ffffff" stroke="#111827" stroke-width="1.8"/>
    <text x="85" y="29" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111827">Search &amp; Filter</text>
  </g>

  <!-- UC6: Record Interview Notes -->
  <g transform="translate(200, 546)">
    <ellipse cx="85" cy="24" rx="85" ry="24" fill="#ffffff" stroke="#111827" stroke-width="1.8"/>
    <text x="85" y="29" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111827">Interview Notes</text>
  </g>

  <!-- UC7: Dark / Light Mode Switch -->
  <g transform="translate(200, 630)">
    <ellipse cx="85" cy="24" rx="85" ry="24" fill="#ffffff" stroke="#111827" stroke-width="1.8"/>
    <text x="85" y="29" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111827">Toggle Dark Theme</text>
  </g>

  <!-- ======================================================== -->
  <!-- ADMIN / TPO USE CASES (Column 3)                         -->
  <!-- ======================================================== -->
  <!-- Horizontal arm from Admin to vertical bus -->
  <line x1="1015" y1="362" x2="980" y2="362" stroke="#111827" stroke-width="2"/>
  <!-- Vertical Bus for Admin Use Cases -->
  <line x1="980" y1="184" x2="980" y2="520" stroke="#111827" stroke-width="1.8"/>

  <!-- Admin UC1: Manage Student Records -->
  <g transform="translate(730, 160)">
    <ellipse cx="105" cy="24" rx="105" ry="24" fill="#ffffff" stroke="#111827" stroke-width="1.8"/>
    <text x="105" y="29" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111827">Manage Student Records</text>
  </g>
  <line x1="980" y1="184" x2="940" y2="184" stroke="#111827" stroke-width="1.8"/>

  <!-- Admin UC2: Manage Placement Drives -->
  <g transform="translate(730, 272)">
    <ellipse cx="105" cy="24" rx="105" ry="24" fill="#ffffff" stroke="#111827" stroke-width="1.8"/>
    <text x="105" y="29" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111827">Manage Campus Drives</text>
  </g>
  <line x1="980" y1="296" x2="940" y2="296" stroke="#111827" stroke-width="1.8"/>

  <!-- Admin UC3: Verify Student Credentials -->
  <g transform="translate(730, 384)">
    <ellipse cx="105" cy="24" rx="105" ry="24" fill="#ffffff" stroke="#111827" stroke-width="1.8"/>
    <text x="105" y="29" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111827">Verify Credentials</text>
  </g>
  <line x1="980" y1="408" x2="940" y2="408" stroke="#111827" stroke-width="1.8"/>

  <!-- Admin UC4: Export Placement Reports -->
  <g transform="translate(730, 496)">
    <ellipse cx="105" cy="24" rx="105" ry="24" fill="#ffffff" stroke="#111827" stroke-width="1.8"/>
    <text x="105" y="29" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111827">Export Analytics Reports</text>
  </g>
  <line x1="980" y1="520" x2="940" y2="520" stroke="#111827" stroke-width="1.8"/>
</svg>
