<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 740" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif;">
  <defs>
    <marker id="arrow-gs2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#111827"/>
    </marker>
    <filter id="shadow-gs2" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Title Header -->
  <text x="575" y="40" text-anchor="middle" font-size="24" font-weight="800" fill="#111827" letter-spacing="0.5">SkillBridge – Student Internship &amp; Career Management Portal</text>
  <text x="575" y="66" text-anchor="middle" font-size="16.5" font-weight="700" fill="#374151">Second Level DFD – Internship Management (2.0)</text>

  <!-- External Entity: Student (Left Side) -->
  <g transform="translate(45, 235)" filter="url(#shadow-gs2)">
    <rect x="0" y="0" width="150" height="96" rx="4" fill="#ffffff" stroke="#111827" stroke-width="2"/>
    <rect x="0" y="0" width="150" height="24" rx="4" fill="#f3f4f6" stroke="#111827" stroke-width="1.2"/>
    <text x="75" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="#4b5563" letter-spacing="1">ENTITY</text>
    <text x="75" y="62" text-anchor="middle" font-size="20" font-weight="800" fill="#111827">Student</text>
  </g>

  <!-- Student -> 2.0 Module Input Flow -->
  <line x1="195" y1="283" x2="353" y2="283" stroke="#111827" stroke-width="2" marker-end="url(#arrow-gs2)"/>
  <rect x="202" y="235" width="146" height="42" fill="#ffffff" rx="3"/>
  <text x="275" y="249" text-anchor="middle" font-size="11.5" font-weight="700" fill="#111827">Internship Requests</text>
  <text x="275" y="263" text-anchor="middle" font-size="10" font-weight="500" fill="#4b5563">(Add / Edit / Delete / Status /</text>
  <text x="275" y="275" text-anchor="middle" font-size="10" font-weight="500" fill="#4b5563">Search / Filter / Notes)</text>

  <!-- Module Boundary: 2.0 Internship Management -->
  <rect x="355" y="90" width="345" height="450" rx="10" fill="#ffffff" stroke="#374151" stroke-width="1.8" stroke-dasharray="6,4"/>
  <rect x="420" y="80" width="220" height="24" rx="4" fill="#f3f4f6" stroke="#374151" stroke-width="1.2"/>
  <text x="530" y="96" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">2.0 Internship Management</text>

  <!-- 7 Subprocesses (Rounded Pills, Academic Grayscale) -->
  <!-- 2.1 Add Internship -->
  <g transform="translate(425, 120)">
    <rect x="0" y="0" width="190" height="40" rx="20" fill="#ffffff" stroke="#111827" stroke-width="1.8"/>
    <text x="95" y="18" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">2.1</text>
    <text x="95" y="31" text-anchor="middle" font-size="11.5" font-weight="700" fill="#111827">Add Internship</text>
  </g>

  <!-- 2.2 Edit Application -->
  <g transform="translate(425, 175)">
    <rect x="0" y="0" width="190" height="40" rx="20" fill="#ffffff" stroke="#111827" stroke-width="1.8"/>
    <text x="95" y="18" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">2.2</text>
    <text x="95" y="31" text-anchor="middle" font-size="11.5" font-weight="700" fill="#111827">Edit Application</text>
  </g>

  <!-- 2.3 Delete Application -->
  <g transform="translate(425, 230)">
    <rect x="0" y="0" width="190" height="40" rx="20" fill="#ffffff" stroke="#111827" stroke-width="1.8"/>
    <text x="95" y="18" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">2.3</text>
    <text x="95" y="31" text-anchor="middle" font-size="11.5" font-weight="700" fill="#111827">Delete Application</text>
  </g>

  <!-- 2.4 Update Status -->
  <g transform="translate(425, 285)">
    <rect x="0" y="0" width="190" height="40" rx="20" fill="#ffffff" stroke="#111827" stroke-width="1.8"/>
    <text x="95" y="18" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">2.4</text>
    <text x="95" y="31" text-anchor="middle" font-size="11.5" font-weight="700" fill="#111827">Update Status</text>
  </g>

  <!-- 2.5 Search Internships -->
  <g transform="translate(425, 340)">
    <rect x="0" y="0" width="190" height="40" rx="20" fill="#ffffff" stroke="#111827" stroke-width="1.8"/>
    <text x="95" y="18" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">2.5</text>
    <text x="95" y="31" text-anchor="middle" font-size="11.5" font-weight="700" fill="#111827">Search Internships</text>
  </g>

  <!-- 2.6 Filter Internships -->
  <g transform="translate(425, 395)">
    <rect x="0" y="0" width="190" height="40" rx="20" fill="#ffffff" stroke="#111827" stroke-width="1.8"/>
    <text x="95" y="18" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">2.6</text>
    <text x="95" y="31" text-anchor="middle" font-size="11.5" font-weight="700" fill="#111827">Filter Internships</text>
  </g>

  <!-- 2.7 Set Stipend & Notes -->
  <g transform="translate(425, 450)">
    <rect x="0" y="0" width="190" height="40" rx="20" fill="#ffffff" stroke="#111827" stroke-width="1.8"/>
    <text x="95" y="17" text-anchor="middle" font-size="11.5" font-weight="800" fill="#111827">2.7</text>
    <text x="95" y="30" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Set Stipend &amp; Notes</text>
  </g>

  <!-- Data Store: D2 Internship Database (Spanning Full Height of Processes) -->
  <g transform="translate(830, 115)" filter="url(#shadow-gs2)">
    <rect x="0" y="0" width="265" height="385" rx="4" fill="#ffffff" stroke="#111827" stroke-width="2"/>
    <rect x="0" y="0" width="55" height="385" rx="4" fill="#e5e7eb" stroke="#111827" stroke-width="1.5"/>
    <text x="27" y="195" text-anchor="middle" font-size="20" font-weight="900" fill="#111827">D2</text>
    <text x="160" y="195" text-anchor="middle" font-size="16" font-weight="800" fill="#111827">Internship Database</text>
    <text x="160" y="218" text-anchor="middle" font-size="12" font-weight="600" fill="#4b5563">(MongoDB Application Store)</text>
  </g>

  <!-- ======================================================== -->
  <!-- PERFECTLY PARALLEL HORIZONTAL FLOWS: 2.1..2.7 to D2     -->
  <!-- Zero clustering, zero overlap, completely straight!      -->
  <!-- ======================================================== -->

  <!-- Flow 2.1 -> D2 -->
  <line x1="615" y1="140" x2="828" y2="140" stroke="#111827" stroke-width="1.8" marker-end="url(#arrow-gs2)"/>
  <rect x="660" y="129" width="115" height="18" fill="#ffffff"/>
  <text x="717" y="142" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">Application Data</text>

  <!-- Flow 2.2 -> D2 -->
  <line x1="615" y1="195" x2="828" y2="195" stroke="#111827" stroke-width="1.8" marker-end="url(#arrow-gs2)"/>
  <rect x="660" y="184" width="115" height="18" fill="#ffffff"/>
  <text x="717" y="197" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">Updated Details</text>

  <!-- Flow 2.3 -> D2 -->
  <line x1="615" y1="250" x2="828" y2="250" stroke="#111827" stroke-width="1.8" marker-end="url(#arrow-gs2)"/>
  <rect x="660" y="239" width="115" height="18" fill="#ffffff"/>
  <text x="717" y="252" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">Deletion Flag</text>

  <!-- Flow 2.4 -> D2 -->
  <line x1="615" y1="305" x2="828" y2="305" stroke="#111827" stroke-width="1.8" marker-end="url(#arrow-gs2)"/>
  <rect x="660" y="294" width="115" height="18" fill="#ffffff"/>
  <text x="717" y="307" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">Status Update</text>

  <!-- Flow 2.5 -> D2 -->
  <line x1="615" y1="360" x2="828" y2="360" stroke="#111827" stroke-width="1.8" marker-end="url(#arrow-gs2)"/>
  <rect x="660" y="349" width="115" height="18" fill="#ffffff"/>
  <text x="717" y="362" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">Search Query</text>

  <!-- Flow 2.6 -> D2 -->
  <line x1="615" y1="415" x2="828" y2="415" stroke="#111827" stroke-width="1.8" marker-end="url(#arrow-gs2)"/>
  <rect x="660" y="404" width="115" height="18" fill="#ffffff"/>
  <text x="717" y="417" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">Filter Criteria</text>

  <!-- Flow 2.7 -> D2 -->
  <line x1="615" y1="470" x2="828" y2="470" stroke="#111827" stroke-width="1.8" marker-end="url(#arrow-gs2)"/>
  <rect x="660" y="459" width="115" height="18" fill="#ffffff"/>
  <text x="717" y="472" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">Stipend &amp; Notes</text>

  <!-- Big Return Flow from D2 to Student (Orthogonal Bottom Corridor) -->
  <path d="M 960 500 L 960 560 L 120 560 L 120 333" fill="none" stroke="#111827" stroke-width="2" marker-end="url(#arrow-gs2)"/>
  <rect x="250" y="549" width="500" height="22" fill="#ffffff" rx="3"/>
  <text x="500" y="564" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Internship Application Pipeline / Status Summaries / Offer Letters</text>

  <!-- Bottom Section: Key Points & Legend -->
  <!-- Key Points Box -->
  <g transform="translate(45, 595)" filter="url(#shadow-gs2)">
    <rect x="0" y="0" width="705" height="120" rx="4" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
    <rect x="0" y="0" width="705" height="26" rx="4" fill="#f3f4f6" stroke="#111827" stroke-width="1"/>
    <text x="15" y="18" font-size="12.5" font-weight="800" fill="#111827">Data Flows (Key Points):</text>

    <text x="15" y="48" font-size="11" font-weight="600" fill="#1f2937">1. Student → Add Internship → D2 Internship Database</text>
    <text x="15" y="68" font-size="11" font-weight="600" fill="#1f2937">2. Student → Edit Application → D2 Internship Database</text>
    <text x="15" y="88" font-size="11" font-weight="600" fill="#1f2937">3. Student → Delete Application → D2 Internship Database</text>
    <text x="15" y="108" font-size="11" font-weight="600" fill="#1f2937">4. Student → Update Status → D2 Internship Database</text>

    <text x="375" y="48" font-size="11" font-weight="600" fill="#1f2937">5. Student → Search Internships → D2 Internship Database</text>
    <text x="375" y="68" font-size="11" font-weight="600" fill="#1f2937">6. Student → Filter Internships → D2 Internship Database</text>
    <text x="375" y="88" font-size="11" font-weight="600" fill="#1f2937">7. Student → Set Stipend &amp; Notes → D2 Internship Database</text>
    <text x="375" y="108" font-size="11" font-weight="600" fill="#1f2937">8. D2 Internship Database → Status Pipeline &amp; KPI Stats → Student</text>
  </g>

  <!-- Legend Box -->
  <g transform="translate(775, 595)" filter="url(#shadow-gs2)">
    <rect x="0" y="0" width="325" height="120" rx="4" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
    <rect x="0" y="0" width="325" height="26" rx="4" fill="#f3f4f6" stroke="#111827" stroke-width="1"/>
    <text x="15" y="18" font-size="12.5" font-weight="800" fill="#111827">Legend:</text>

    <!-- Entity -->
    <rect x="20" y="38" width="20" height="13" rx="2" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
    <text x="48" y="49" font-size="11" font-weight="600" fill="#1f2937">= External Entity</text>

    <!-- Process -->
    <rect x="20" y="58" width="22" height="13" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
    <text x="48" y="69" font-size="11" font-weight="600" fill="#1f2937">= Process</text>

    <!-- Data Store -->
    <rect x="20" y="78" width="20" height="13" rx="2" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
    <line x1="26" y1="78" x2="26" y2="91" stroke="#111827" stroke-width="1.5"/>
    <text x="48" y="89" font-size="11" font-weight="600" fill="#1f2937">= Data Store</text>

    <!-- Flow -->
    <line x1="175" y1="45" x2="205" y2="45" stroke="#111827" stroke-width="1.8" marker-end="url(#arrow-gs2)"/>
    <text x="215" y="49" font-size="11" font-weight="600" fill="#1f2937">= Data Flow</text>

    <!-- Boundary -->
    <rect x="175" y="68" width="22" height="14" fill="none" stroke="#374151" stroke-width="1.2" stroke-dasharray="3,2"/>
    <text x="205" y="79" font-size="11" font-weight="600" fill="#1f2937">= Module Boundary</text>
  </g>
</svg>
