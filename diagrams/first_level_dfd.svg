<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 720" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif;">
  <defs>
    <!-- Crisp Grayscale Arrowhead Marker -->
    <marker id="arrow-gs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#111827"/>
    </marker>
    <!-- Subtle drop shadow -->
    <filter id="shadow-gs" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Title Header -->
  <text x="575" y="40" text-anchor="middle" font-size="24" font-weight="800" fill="#111827" letter-spacing="0.5">SkillBridge – Student Internship &amp; Career Management Portal</text>
  <text x="575" y="66" text-anchor="middle" font-size="16.5" font-weight="700" fill="#374151">First Level Data Flow Diagram (Level 1.0 DFD) – Grayscale</text>

  <!-- External Entity: Student (Left Side) -->
  <g transform="translate(45, 235)" filter="url(#shadow-gs)">
    <rect x="0" y="0" width="150" height="96" rx="4" fill="#ffffff" stroke="#111827" stroke-width="2"/>
    <rect x="0" y="0" width="150" height="24" rx="4" fill="#f3f4f6" stroke="#111827" stroke-width="1.2"/>
    <text x="75" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="#4b5563" letter-spacing="1">ENTITY</text>
    <text x="75" y="62" text-anchor="middle" font-size="20" font-weight="800" fill="#111827">Student</text>
  </g>

  <!-- Central Process: 1.0 SkillBridge System (Center) -->
  <g transform="translate(425, 205)" filter="url(#shadow-gs)">
    <circle cx="85" cy="85" r="85" fill="#f9fafb" stroke="#111827" stroke-width="2.5"/>
    <circle cx="85" cy="85" r="77" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="85" y="62" text-anchor="middle" font-size="20" font-weight="800" fill="#111827">1.0</text>
    <text x="85" y="88" text-anchor="middle" font-size="18" font-weight="800" fill="#111827">SkillBridge</text>
    <text x="85" y="112" text-anchor="middle" font-size="18" font-weight="800" fill="#111827">System</text>
  </g>

  <!-- Flows between Student Entity and Central System -->
  <!-- Student -> System (Top flow) -->
  <line x1="195" y1="265" x2="423" y2="265" stroke="#111827" stroke-width="2" marker-end="url(#arrow-gs)"/>
  <rect x="210" y="244" width="200" height="19" fill="#ffffff" rx="3"/>
  <text x="310" y="258" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Login / Registration Details</text>

  <!-- System -> Student (Bottom flow) -->
  <line x1="425" y1="305" x2="197" y2="305" stroke="#111827" stroke-width="2" marker-end="url(#arrow-gs)"/>
  <rect x="208" y="309" width="204" height="19" fill="#ffffff" rx="3"/>
  <text x="310" y="323" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Authentication Result &amp; Token</text>

  <!-- Data Stores Stack (Right Side) -->
  <!-- D1: User Database -->
  <g transform="translate(820, 100)" filter="url(#shadow-gs)">
    <rect x="0" y="0" width="280" height="46" rx="3" fill="#ffffff" stroke="#111827" stroke-width="2"/>
    <rect x="0" y="0" width="55" height="46" rx="3" fill="#e5e7eb" stroke="#111827" stroke-width="1.5"/>
    <text x="27" y="29" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">D1</text>
    <text x="165" y="29" text-anchor="middle" font-size="14.5" font-weight="700" fill="#111827">User Database</text>
  </g>

  <!-- D2: Internship Database -->
  <g transform="translate(820, 175)" filter="url(#shadow-gs)">
    <rect x="0" y="0" width="280" height="46" rx="3" fill="#ffffff" stroke="#111827" stroke-width="2"/>
    <rect x="0" y="0" width="55" height="46" rx="3" fill="#e5e7eb" stroke="#111827" stroke-width="1.5"/>
    <text x="27" y="29" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">D2</text>
    <text x="165" y="29" text-anchor="middle" font-size="14.5" font-weight="700" fill="#111827">Internship Database</text>
  </g>

  <!-- D3: Application Status Database -->
  <g transform="translate(820, 250)" filter="url(#shadow-gs)">
    <rect x="0" y="0" width="280" height="46" rx="3" fill="#ffffff" stroke="#111827" stroke-width="2"/>
    <rect x="0" y="0" width="55" height="46" rx="3" fill="#e5e7eb" stroke="#111827" stroke-width="1.5"/>
    <text x="27" y="29" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">D3</text>
    <text x="165" y="29" text-anchor="middle" font-size="14.5" font-weight="700" fill="#111827">Application Status Store</text>
  </g>

  <!-- D4: Student Profile Database -->
  <g transform="translate(820, 325)" filter="url(#shadow-gs)">
    <rect x="0" y="0" width="280" height="46" rx="3" fill="#ffffff" stroke="#111827" stroke-width="2"/>
    <rect x="0" y="0" width="55" height="46" rx="3" fill="#e5e7eb" stroke="#111827" stroke-width="1.5"/>
    <text x="27" y="29" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">D4</text>
    <text x="165" y="29" text-anchor="middle" font-size="14.5" font-weight="700" fill="#111827">Student Profile Store</text>
  </g>

  <!-- D5: Interview Notes Database -->
  <g transform="translate(820, 400)" filter="url(#shadow-gs)">
    <rect x="0" y="0" width="280" height="46" rx="3" fill="#ffffff" stroke="#111827" stroke-width="2"/>
    <rect x="0" y="0" width="55" height="46" rx="3" fill="#e5e7eb" stroke="#111827" stroke-width="1.5"/>
    <text x="27" y="29" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">D5</text>
    <text x="165" y="29" text-anchor="middle" font-size="14.5" font-weight="700" fill="#111827">Interview Notes Store</text>
  </g>

  <!-- D6: Placement Analytics Database -->
  <g transform="translate(820, 475)" filter="url(#shadow-gs)">
    <rect x="0" y="0" width="280" height="46" rx="3" fill="#ffffff" stroke="#111827" stroke-width="2"/>
    <rect x="0" y="0" width="55" height="46" rx="3" fill="#e5e7eb" stroke="#111827" stroke-width="1.5"/>
    <text x="27" y="29" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">D6</text>
    <text x="165" y="29" text-anchor="middle" font-size="14.5" font-weight="700" fill="#111827">Placement Analytics Store</text>
  </g>

  <!-- ======================================================== -->
  <!-- PERFECT ORTHOGONAL FLOWS: 1.0 System <-> Data Stores    -->
  <!-- ======================================================== -->

  <!-- D1 Flows (Orthogonal routing from top of circle) -->
  <!-- System -> D1 (Upper arrow: User Data) -->
  <path d="M 510 205 L 510 113 L 818 113" fill="none" stroke="#111827" stroke-width="1.8" marker-end="url(#arrow-gs)"/>
  <rect x="630" y="102" width="90" height="18" fill="#ffffff"/>
  <text x="675" y="115" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">User Data</text>

  <!-- D1 -> System (Lower arrow: User Details) -->
  <path d="M 820 133 L 530 133 L 530 207" fill="none" stroke="#111827" stroke-width="1.8" marker-end="url(#arrow-gs)"/>
  <rect x="630" y="136" width="90" height="18" fill="#ffffff"/>
  <text x="675" y="149" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">User Details</text>

  <!-- D2 Flows (Straight from circle top-right) -->
  <!-- System -> D2 (Upper arrow: Internship Data) -->
  <path d="M 570 230 L 610 230 L 610 188 L 818 188" fill="none" stroke="#111827" stroke-width="1.8" marker-end="url(#arrow-gs)"/>
  <rect x="640" y="177" width="110" height="18" fill="#ffffff"/>
  <text x="695" y="190" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">Internship Data</text>

  <!-- D2 -> System (Lower arrow: Internship Details) -->
  <path d="M 820 208 L 625 208 L 625 242 L 585 242" fill="none" stroke="#111827" stroke-width="1.8" marker-end="url(#arrow-gs)"/>
  <rect x="640" y="211" width="110" height="18" fill="#ffffff"/>
  <text x="695" y="224" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">Internship Details</text>

  <!-- D3 Flows (Direct Horizontal Alignment) -->
  <!-- System -> D3 (Upper arrow: Application Data) -->
  <line x1="595" y1="263" x2="818" y2="263" stroke="#111827" stroke-width="1.8" marker-end="url(#arrow-gs)"/>
  <rect x="640" y="252" width="115" height="18" fill="#ffffff"/>
  <text x="697" y="265" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">Application Data</text>

  <!-- D3 -> System (Lower arrow: Application Status) -->
  <line x1="820" y1="283" x2="597" y2="283" stroke="#111827" stroke-width="1.8" marker-end="url(#arrow-gs)"/>
  <rect x="640" y="286" width="115" height="18" fill="#ffffff"/>
  <text x="697" y="299" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">Application Status</text>

  <!-- D4 Flows (Orthogonal routing) -->
  <!-- System -> D4 (Upper arrow: Profile Data) -->
  <path d="M 585 330 L 625 330 L 625 338 L 818 338" fill="none" stroke="#111827" stroke-width="1.8" marker-end="url(#arrow-gs)"/>
  <rect x="645" y="327" width="110" height="18" fill="#ffffff"/>
  <text x="700" y="340" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">Student Profile</text>

  <!-- D4 -> System (Lower arrow: Profile Details) -->
  <path d="M 820 358 L 610 358 L 610 345 L 575 345" fill="none" stroke="#111827" stroke-width="1.8" marker-end="url(#arrow-gs)"/>
  <rect x="645" y="361" width="110" height="18" fill="#ffffff"/>
  <text x="700" y="374" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">Profile Details</text>

  <!-- D5 Flows (Orthogonal routing down from circle) -->
  <!-- System -> D5 (Upper arrow: Interview Notes) -->
  <path d="M 545 365 L 545 413 L 818 413" fill="none" stroke="#111827" stroke-width="1.8" marker-end="url(#arrow-gs)"/>
  <rect x="640" y="402" width="120" height="18" fill="#ffffff"/>
  <text x="700" y="415" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">Interview Notes</text>

  <!-- D5 -> System (Lower arrow: Interview Schedule) -->
  <path d="M 820 433 L 530 433 L 530 372" fill="none" stroke="#111827" stroke-width="1.8" marker-end="url(#arrow-gs)"/>
  <rect x="640" y="436" width="120" height="18" fill="#ffffff"/>
  <text x="700" y="449" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">Interview Schedule</text>

  <!-- D6 Flows (Orthogonal routing down from bottom of circle) -->
  <!-- System -> D6 (Upper arrow: Progress Data) -->
  <path d="M 510 375 L 510 488 L 818 488" fill="none" stroke="#111827" stroke-width="1.8" marker-end="url(#arrow-gs)"/>
  <rect x="640" y="477" width="120" height="18" fill="#ffffff"/>
  <text x="700" y="490" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">Progress Data</text>

  <!-- D6 -> System (Lower arrow: Progress Report) -->
  <path d="M 820 508 L 490 508 L 490 373" fill="none" stroke="#111827" stroke-width="1.8" marker-end="url(#arrow-gs)"/>
  <rect x="640" y="511" width="120" height="18" fill="#ffffff"/>
  <text x="700" y="524" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111827">Progress Report</text>

  <!-- Bottom Section: Key Points & Academic Legend -->
  <!-- Key Points Box -->
  <g transform="translate(45, 565)" filter="url(#shadow-gs)">
    <rect x="0" y="0" width="705" height="125" rx="4" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
    <rect x="0" y="0" width="705" height="26" rx="4" fill="#f3f4f6" stroke="#111827" stroke-width="1"/>
    <text x="15" y="18" font-size="12.5" font-weight="800" fill="#111827">Data Flows (Key Points):</text>
    
    <text x="15" y="48" font-size="11" font-weight="600" fill="#1f2937">1. Student → Login / Register → 1.0 SkillBridge System</text>
    <text x="15" y="68" font-size="11" font-weight="600" fill="#1f2937">2. 1.0 System ↔ D1 User Database (Store / Verify Credentials)</text>
    <text x="15" y="88" font-size="11" font-weight="600" fill="#1f2937">3. 1.0 System ↔ D2 Internship Database (Post / Fetch Listings)</text>
    <text x="15" y="108" font-size="11" font-weight="600" fill="#1f2937">4. 1.0 System ↔ D3 Application Store (Status &amp; Pipeline Data)</text>

    <text x="375" y="48" font-size="11" font-weight="600" fill="#1f2937">5. 1.0 System ↔ D4 Student Profile Store (Skills &amp; Resume)</text>
    <text x="375" y="68" font-size="11" font-weight="600" fill="#1f2937">6. 1.0 System ↔ D5 Interview Notes Store (Prep &amp; Feedback)</text>
    <text x="375" y="88" font-size="11" font-weight="600" fill="#1f2937">7. 1.0 System ↔ D6 Placement Analytics Store (KPI Aggregation)</text>
    <text x="375" y="108" font-size="11" font-weight="600" fill="#1f2937">8. 1.0 System → Live Dashboard &amp; Analytics → Student</text>
  </g>

  <!-- Legend Box -->
  <g transform="translate(775, 565)" filter="url(#shadow-gs)">
    <rect x="0" y="0" width="325" height="125" rx="4" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
    <rect x="0" y="0" width="325" height="26" rx="4" fill="#f3f4f6" stroke="#111827" stroke-width="1"/>
    <text x="15" y="18" font-size="12.5" font-weight="800" fill="#111827">Legend:</text>

    <!-- Entity -->
    <rect x="20" y="42" width="22" height="14" rx="2" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
    <text x="50" y="54" font-size="11.5" font-weight="600" fill="#1f2937">= External Entity</text>

    <!-- Process -->
    <circle cx="31" cy="76" r="8" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
    <text x="50" y="80" font-size="11.5" font-weight="600" fill="#1f2937">= Process</text>

    <!-- Data Store -->
    <rect x="20" y="97" width="22" height="14" rx="2" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
    <line x1="27" y1="97" x2="27" y2="111" stroke="#111827" stroke-width="1.5"/>
    <text x="50" y="109" font-size="11.5" font-weight="600" fill="#1f2937">= Data Store</text>

    <!-- Flow -->
    <line x1="185" y1="49" x2="225" y2="49" stroke="#111827" stroke-width="1.8" marker-end="url(#arrow-gs)"/>
    <text x="235" y="53" font-size="11.5" font-weight="600" fill="#1f2937">= Data Flow</text>
  </g>
</svg>
